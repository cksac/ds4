[package]
name = "ds4f"
version = "0.1.0"
edition = "2021"
description = "Rust port of the DS4 Flash inference engine — Metal backend, CLI, and HTTP server"
license = "MIT"

[[bin]]
name = "ds4f"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3.2", features = [
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDataType",
    "MTLDevice",
    "MTLFunctionConstantValues",
    "MTLLibrary",
    "MTLResource",
    "block2",
] }
objc2-foundation = "0.3"
memmap2 = "0.9"
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
